name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # Python dependencies come from uv.lock, so CI tests the same versions
      # a user installs with `uv sync --frozen`.
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install locked Python environment
        run: uv sync --frozen --extra inference
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run Rust tests (builds target/release/astrosearch)
        run: cargo test --release
      - name: Check Python syntax
        run: uv run --frozen python -m py_compile scripts/*.py scripts/vetting/*.py tests/*.py
      - name: Run Python unit, parity-fuzz and gate integration tests
        run: uv run --frozen python -m unittest discover -s tests -p 'test_*.py'
