name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # Python dependencies come from uv.lock, so CI tests the same versions
      # a user installs with `uv sync --frozen`.
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install locked Python environment
        run: uv sync --frozen --extra inference
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run Rust tests (builds target/release/astrosearch)
        run: cargo test --release
      - name: Check Python syntax
        run: uv run --frozen python -m py_compile scripts/*.py scripts/vetting/*.py tests/*.py
      # Correctness rules only (undefined names, unused imports and variables,
      # redefinitions); style is not enforced. An undefined name in the TCE
      # check once disabled the gate's "not already known" criterion.
      - name: Lint for Python correctness defects
        run: uvx ruff@0.17.0 check --select F scripts tests
      # The project installs editable (uv sync), so scripts/ needs no path hacks.
      # Coverage scope is the shipped package (pyproject [tool.coverage]),
      # with CLIs run as subprocesses measured too.
      - name: Run Python tests under coverage (package gate 60%)
        run: |
          uv run --frozen python -m coverage run -m unittest discover -s tests -p 'test_*.py'
          uv run --frozen python -m coverage combine
          uv run --frozen python -m coverage report --fail-under=60
